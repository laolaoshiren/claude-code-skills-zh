# 掘金自动化脚本的离线安全回归；不会读取 Cookie 或访问发布接口
name: Script Safety

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/script-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/script-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Python offline safety tests
        run: python scripts/test_juejin_safety.py

      - name: Node offline safety tests
        working-directory: scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --check post_to_juejin.js
          node --check test_juejin_post.js
          npm audit --omit=dev
