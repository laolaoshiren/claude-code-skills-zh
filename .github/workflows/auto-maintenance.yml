# 每周一次自动同步 README / 官网统计并执行质量检查
#
# 维护约定（请勿收紧）：
# - cron 刻意保持每周一次。本工作流会批量查询全库 440+ 个仓库的 Star 并可能
#   自动提交，频率过高只会增加 GitHub API 与 Actions 的消耗，不产生额外价值。
# - workflow_dispatch 仅用于异常时补跑，不要频繁手动触发。
name: Auto Maintenance

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 2:00 UTC（北京 10:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run sync regression tests
        run: python scripts/test_sync_readme_to_site.py

      - name: Sync README badges and website data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_readme_to_site.py --fetch-stars

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: '**/*.md'

      - name: Check whitespace
        run: git diff --check

      - name: Commit automatic maintenance updates
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md docs/index.html docs/sitemap.xml; then
            echo "No automatic maintenance changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs/index.html docs/sitemap.xml
          git diff --cached --check
          git commit -m "docs: auto maintenance sync"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push automatic maintenance updates
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref }}
          TARGET_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_REF_TYPE" != "branch" ]]; then
            echo "Refusing to push non-branch ref: $TARGET_REF" >&2
            exit 1
          fi

          askpass="$RUNNER_TEMP/git-askpass.sh"
          umask 077
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT

          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push origin "HEAD:$TARGET_REF"
